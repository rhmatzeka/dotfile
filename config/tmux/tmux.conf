# ~/.config/tmux/tmux.conf  (managed by rhmatzeka/dotfile; needs tmux >= 3.1)

# ── basics ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"
set -g escape-time 10
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
setw -g mode-keys vi

# ── keys ─────────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── look (Dracula palette, cyan accent) ──────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#0d1117,fg=#c9d1d9"
set -g status-left-length 30
set -g status-left "#[bg=#00d9ff,fg=#0d1117,bold] #S #[default] "
set -g status-right "#[fg=#6272a4]%a %d %b #[fg=#00d9ff,bold]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#ff79c6,bold] #I:#W "
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#00d9ff"
set -g message-style "bg=#0d1117,fg=#ff79c6"
set -g mode-style "bg=#1f3a4d,fg=#ffffff"
