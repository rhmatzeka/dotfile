# /etc/tmpfiles.d/hibernate-image-size.conf  (managed by rhmatzeka/dotfile)
# Make the hibernation image as small as possible. The default (2/5 of RAM) leaves too little free memory on
# laptops with ~8 GB and an AMD APU: the GPU copies its VRAM into RAM while freezing, the snapshot then fails with
# "PM: hibernation: Error -12 creating image" and the GPU does not come back (black screen, system still on).
# With 0 the kernel first moves as much as it can to swap, so the snapshot has room.
w /sys/power/image_size - - - - 0
