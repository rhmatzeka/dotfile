# /etc/systemd/system/systemd-hibernate.service.d/poweroff-on-failure.conf  (managed by rhmatzeka/dotfile)
# Caelestia hibernates at critical battery. If hibernation fails, the AMD GPU is left without a picture and the
# laptop keeps running on an empty battery with a black screen; powering off is the safer end.
[Unit]
OnFailure=poweroff.target
