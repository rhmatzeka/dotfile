## elinks: dark theme with cyan links, tabs always visible, 256 colours
set terminal.xterm-ghostty.colors = 3
set terminal.xterm-256color.colors = 3
set ui.tabs.show_bar = 2
set ui.tabs.wraparound = 1
set ui.show_title_bar = 1
set ui.show_status_bar = 1
set ui.startup_goto_dialog = 0
set document.colors.use_document_colors = 0
set document.colors.text = "#dfe6ee"
set document.colors.background = "#0d1117"
set document.colors.link = "#00d9ff"
set document.colors.vlink = "#bd93f9"
set document.browse.links.numbering = 1
set document.browse.images.show_as_links = 1
set document.cache.memory.size = 4M
