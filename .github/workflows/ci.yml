name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4 jq
      - name: shellcheck
        run: shellcheck -x -S warning install.sh uninstall.sh lib/*.sh linux/*.sh linux/debian/*.sh macos/*.sh tests/*.sh bin/web bin/firefox-for-browsh
      - name: Syntax
        run: |
          for f in install.sh uninstall.sh lib/*.sh linux/*.sh linux/debian/*.sh macos/*.sh; do bash -n "$f"; done
          jq . config/caelestia/shell.json >/dev/null
          jq . config/windows-terminal/dotfiles.json >/dev/null
          for f in config/nvim/dotfiles.lua config/caelestia/*.lua; do luac5.4 -p "$f" 2>&1 || lua5.4 -e "assert(loadfile('$f'))"; done
      - name: Menu (scripted answers)
        run: tests/menu.sh
      - name: Dry run (everything except the desktop, which needs Debian 13)
        run: ./install.sh --dry-run --yes --only base,shell,tmux,nvim,terminal,browsers
      - name: Real run of the user-level parts in a throw-away HOME
        run: |
          export HOME="$(mktemp -d)"
          "$GITHUB_WORKSPACE/install.sh" --yes --only shell,tmux,terminal
          test -L "$HOME/.zshrc" && test -L "$HOME/.config/tmux/tmux.conf"
          "$GITHUB_WORKSPACE/uninstall.sh" --yes
          test ! -e "$HOME/.zshrc"

  # macOS ships bash 3.2; everything here runs with /bin/bash on purpose (the runner's PATH has a newer bash first).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 3.2 syntax
        run: |
          /bin/bash --version | head -n1
          for f in install.sh uninstall.sh lib/common.sh lib/menu.sh lib/parts.sh linux/uninstall.sh macos/*.sh tests/menu.sh; do /bin/bash -n "$f"; done
      - name: Menu (scripted answers, bash 3.2)
        run: /bin/bash tests/menu.sh
      - name: Dry run of every macOS component
        run: /bin/bash ./install.sh --dry-run --yes --all
      - name: Linux-only parts are refused
        run: |
          if /bin/bash ./install.sh --dry-run --yes --only desktop; then echo "desktop was accepted on macOS"; exit 1; fi
          if /bin/bash ./install.sh --dry-run --yes --only apps; then echo "apps was accepted on macOS"; exit 1; fi
      - name: Real run of shell, tmux, browsers and rust in a throw-away HOME
        run: |
          export HOME="$(mktemp -d)"
          /bin/bash "$GITHUB_WORKSPACE/install.sh" --yes --only shell,tmux,browsers,rust
          test -L "$HOME/.zshrc" && test -L "$HOME/.config/tmux/tmux.conf" && test -d "$HOME/.oh-my-zsh"
          command -v starship tmux w3m
          { command -v cargo || ls "$HOME/.cargo/bin/cargo"; } && cargo --version   # the runner may already have rustup
          zsh -ic 'echo zsh loads the config: $STARSHIP_CONFIG'
          /bin/bash "$GITHUB_WORKSPACE/uninstall.sh" --yes
          test ! -e "$HOME/.zshrc"

  # Windows: the checks run under both Windows PowerShell 5.1 (what every Windows has) and PowerShell 7.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse, ASCII and menu checks (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows.ps1
      - name: Parse, ASCII and menu checks (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests\windows.ps1
      - name: PSScriptAnalyzer (errors)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Dry run of every Windows component (through the entry script)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -DryRun -Yes -All
      - name: winget on the runner
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
      - name: Real run of shell and terminal in a throw-away home, then uninstall
        shell: powershell
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'home'
          $env:DOTFILES_HOME = $t; $env:DOTFILES_DOCUMENTS = "$t\Documents"; $env:DOTFILES_LOCALAPPDATA = "$t\AppData\Local"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Yes -Only shell,terminal
          if ($LASTEXITCODE -ne 0) { throw "install failed: $LASTEXITCODE" }
          $p7 = "$t\Documents\PowerShell\Microsoft.PowerShell_profile.ps1"; $p5 = "$t\Documents\WindowsPowerShell\Microsoft.PowerShell_profile.ps1"
          foreach ($f in $p7, $p5, "$t\.config\starship.toml", "$t\AppData\Local\Microsoft\Windows Terminal\Fragments\rhmatzeka-dotfile\dotfiles.json") {
            if (-not (Test-Path $f)) { throw "missing: $f" }; Write-Host "present: $f"
          }
          # the profile loads in both PowerShells and gives the starship prompt
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          pwsh -NoProfile -Command ". '$p7'; if (-not (Get-Command starship -ErrorAction SilentlyContinue)) { exit 3 }; prompt | Out-Null; 'pwsh profile ok'"
          if ($LASTEXITCODE -ne 0) { throw "pwsh profile failed: $LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -Command ". '$p5'; prompt | Out-Null; 'powershell 5.1 profile ok'"
          if ($LASTEXITCODE -ne 0) { throw "5.1 profile failed: $LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\uninstall.ps1 -Yes
          if (Test-Path $p7) { throw "uninstall left $p7" }
          'uninstall ok'

  # Windows, the heavy part: Neovim with NvChad, a C compiler, tree-sitter parsers and Mason, for real (10-20 minutes).
  windows-nvim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: winget on the runner
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
      - name: Real run of nvim
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Yes -Only nvim
          if ($LASTEXITCODE -ne 0) { throw "install failed: $LASTEXITCODE" }
      - name: Parsers and LSP servers are there
        shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $data = "$env:LOCALAPPDATA\nvim-data"
          Get-ChildItem "$data\site\parser" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          foreach ($p in 'lua', 'php', 'html', 'javascript') {
            if (-not (Get-ChildItem "$data\site\parser" -Filter "$p.*" -ErrorAction SilentlyContinue)) { throw "parser missing: $p" }
          }
          Get-ChildItem "$data\mason\packages" | Select-Object -ExpandProperty Name
          foreach ($m in (Get-Content config\nvim\mason-packages | Where-Object { $_ })) {
            if (-not (Test-Path "$data\mason\packages\$m")) {
              Get-ChildItem $data -Filter 'mason*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
              throw "Mason package missing: $m"
            }
          }
          nvim --headless "+lua print(vim.treesitter.language.add('php') and 'php parser loads' or 'no php')" +qa
