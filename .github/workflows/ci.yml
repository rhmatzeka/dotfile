name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4 jq
      - name: shellcheck
        run: shellcheck -x -S warning install.sh uninstall.sh lib/*.sh linux/*.sh linux/debian/*.sh macos/*.sh tests/*.sh bin/web bin/firefox-for-browsh
      - name: Syntax
        run: |
          for f in install.sh uninstall.sh lib/*.sh linux/*.sh linux/debian/*.sh macos/*.sh; do bash -n "$f"; done
          jq . config/caelestia/shell.json >/dev/null
          for f in config/nvim/dotfiles.lua config/caelestia/*.lua; do luac5.4 -p "$f" 2>&1 || lua5.4 -e "assert(loadfile('$f'))"; done
      - name: Menu (scripted answers)
        run: tests/menu.sh
      - name: Dry run (everything except the desktop, which needs Debian 13)
        run: ./install.sh --dry-run --yes --only base,shell,tmux,nvim,terminal,browsers
      - name: Real run of the user-level parts in a throw-away HOME
        run: |
          export HOME="$(mktemp -d)"
          "$GITHUB_WORKSPACE/install.sh" --yes --only shell,tmux,terminal
          test -L "$HOME/.zshrc" && test -L "$HOME/.config/tmux/tmux.conf"
          "$GITHUB_WORKSPACE/uninstall.sh" --yes
          test ! -e "$HOME/.zshrc"

  # macOS ships bash 3.2; everything here runs with /bin/bash on purpose (the runner's PATH has a newer bash first).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 3.2 syntax
        run: |
          /bin/bash --version | head -n1
          for f in install.sh uninstall.sh lib/common.sh lib/menu.sh lib/parts.sh linux/uninstall.sh macos/*.sh tests/menu.sh; do /bin/bash -n "$f"; done
      - name: Menu (scripted answers, bash 3.2)
        run: /bin/bash tests/menu.sh
      - name: Dry run of every macOS component
        run: /bin/bash ./install.sh --dry-run --yes --all
      - name: Linux-only parts are refused
        run: |
          if /bin/bash ./install.sh --dry-run --yes --only desktop; then echo "desktop was accepted on macOS"; exit 1; fi
          if /bin/bash ./install.sh --dry-run --yes --only apps; then echo "apps was accepted on macOS"; exit 1; fi
      - name: Real run of shell, tmux, browsers and rust in a throw-away HOME
        run: |
          export HOME="$(mktemp -d)"
          /bin/bash "$GITHUB_WORKSPACE/install.sh" --yes --only shell,tmux,browsers,rust
          test -L "$HOME/.zshrc" && test -L "$HOME/.config/tmux/tmux.conf" && test -d "$HOME/.oh-my-zsh"
          command -v starship tmux w3m
          "$HOME/.cargo/bin/cargo" --version
          zsh -ic 'echo zsh loads the config: $STARSHIP_CONFIG'
          /bin/bash "$GITHUB_WORKSPACE/uninstall.sh" --yes
          test ! -e "$HOME/.zshrc"
